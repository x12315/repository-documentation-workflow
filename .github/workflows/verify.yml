name: Verify

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  deterministic:
    name: Deterministic / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: scripts/verify

  agent-skills-smoke:
    name: Agent Skills smoke / Python 3.14 / Node 24
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: python3 scripts/smoke_agent_skills_install.py
